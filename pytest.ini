# NOT: addopts icinde satir ici yorum KULLANILMAZ — yorum ifadenin parcasi olur
# ve marker filtresini bozar. 'not mutating' varsayilani canli veri degistiren
# testleri disarida tutar; kosmak icin: pytest -m mutating  (CLI -m bunu ezer)
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    -m "not mutating"
    --tb=short
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: hizli dogrulama testleri (kritik endpointler)
    auth: kimlik dogrulama gerektiren testler (ACCESS_TOKEN ya da TEST_EMAIL+OTP_CODE ister)
    negative: hata / gecersiz girdi senaryolari
    schema: sozlesme/sema dogrulama testleri (agsiz calisir)
    boundary: sinir deger / idempotency / buyuk payload / unicode testleri
    security: OWASP API guvenlik farkindaligi (BOLA, kirik auth, metot, injection, rate-limit)
    mutating: canli veri yaratir/degistirir — varsayilan kosumda haric tutulmali
