<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Endpoint Panosu</title>
<style>
  :root {
    /* Acik tema — varsayilan */
    --bg: #f6f7f9;      --panel: #ffffff;   --line: #dde1e7;   --fg: #1a1d23;
    --dim: #667085;     --accent: #2563eb;  --ok: #15803d;     --warn: #a16207;
    --err: #b91c1c;     --hi: #c2410c;
    --hover: #eef1f5;   --sel: #e4ecfb;     --body: #3d4450;
    --ok-bg: #eefaf1;   --ok-br: #b7e4c7;
    --err-bg: #fdf0ef;  --err-br: #f3c4c0;
    --warn-bg: #fdf7e7; --warn-br: #ecd9a3; --warn-fg: #7a5a10;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;      --panel: #161a21;   --line: #262c37;   --fg: #e6e9ef;
    --dim: #8b94a5;     --accent: #5b9dff;  --ok: #3fb950;     --warn: #d29922;
    --err: #f85149;     --hi: #ff7b45;
    --hover: #1b202a;   --sel: #1d2836;     --body: #c3cad6;
    --ok-bg: #10251a;   --ok-br: #1d4429;
    --err-bg: #2a1416;  --err-br: #4a1f22;
    --warn-bg: #2a2110; --warn-br: #4a3a1a; --warn-fg: #e8d5a8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
           padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .meta { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .spacer { flex: 1; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); }
  .pill.on { color: var(--ok); border-color: var(--ok); }
  .pill.off { color: var(--warn); border-color: var(--warn); }
  button { font: inherit; background: var(--accent); color: #fff; border: 0;
           padding: 7px 14px; border-radius: 6px; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, textarea, select { font: inherit; background: var(--bg); color: var(--fg);
           border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; }
  textarea { font-family: var(--mono); font-size: 12px; min-height: 90px; resize: vertical; }
  main { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 53px); }
  #list { border-right: 1px solid var(--line); overflow-y: auto; }
  #filters { position: sticky; top: 0; background: var(--panel); padding: 10px;
             border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .row { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--sel); border-left: 2px solid var(--accent); }
  .row .top { display: flex; align-items: center; gap: 8px; }
  .m { font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 1px 5px;
       border-radius: 3px; border: 1px solid currentColor; }
  .m.GET { color: var(--ok); } .m.POST { color: var(--accent); }
  .m.PATCH, .m.PUT { color: var(--warn); } .m.DELETE { color: var(--err); }
  .row .p { font-family: var(--mono); font-size: 12px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
  .row .s { color: var(--dim); font-size: 11px; }
  .flag { color: var(--warn); }
  #detail { overflow-y: auto; padding: 18px 22px; }
  .empty { color: var(--dim); padding: 40px; text-align: center; }
  h2 { font-size: 16px; margin: 0 0 4px; font-family: var(--mono); }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 16px; }
  section { border: 1px solid var(--line); border-radius: 8px; padding: 14px;
            margin-bottom: 14px; background: var(--panel); }
  section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
               color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  pre { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 10px;
        border-radius: 6px; border: 1px solid var(--line); overflow-x: auto; margin: 0;
        max-height: 380px; overflow-y: auto; }
  .grid { display: grid; gap: 8px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px; font-size: 13px; }
  .kv dt { color: var(--dim); }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; }
  .verdict { padding: 9px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-br); }
  .verdict.bad { background: var(--err-bg); color: var(--err); border: 1px solid var(--err-br); }
  .verdict.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-br); }
  .warnbox { background: var(--warn-bg); border: 1px solid var(--warn-br); color: var(--warn-fg);
             padding: 10px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; }
  label { font-size: 12px; color: var(--dim); display: block; margin-bottom: 4px; }
  .finding { border-left: 3px solid var(--line); background: var(--bg); padding: 8px 12px;
             border-radius: 0 6px 6px 0; margin-bottom: 6px; }
  .finding.kritik { border-left-color: var(--err); }
  .finding.yuksek { border-left-color: var(--hi); }
  .finding.orta   { border-left-color: var(--warn); }
  .finding.bilgi  { border-left-color: var(--dim); }
  .finding b { font-size: 13px; }
  .finding p { margin: 3px 0 0; font-size: 12px; color: var(--body); }
  .finding .oneri { color: var(--accent); font-size: 12px; margin-top: 3px; }
  .sev { font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
         padding: 1px 6px; border-radius: 8px; border: 1px solid currentColor; margin-right: 6px; }
  .sev.kritik { color: var(--err); } .sev.yuksek { color: var(--hi); }
  .sev.orta { color: var(--warn); }  .sev.bilgi { color: var(--dim); }
  .jbadge { font-size: 9px; padding: 1px 5px; border-radius: 8px; border: 1px solid var(--line);
            color: var(--dim); font-family: var(--mono); }
  .jbadge.test { color: var(--warn); border-color: var(--warn); }
  table.jt { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.jt td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.jt td:first-child { font-family: var(--mono); white-space: nowrap; }
  table.jt a { color: var(--accent); text-decoration: none; }
  table.jt a:hover { text-decoration: underline; }
  .st { font-size: 11px; color: var(--dim); white-space: nowrap; }
  .st.hot { color: var(--warn); font-weight: 600; }
  .ty { font-size: 11px; color: var(--dim); white-space: nowrap; }
  .modes { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .modes .mode { background: transparent; color: var(--dim); border: 0; padding: 5px 12px;
                 font-size: 12px; border-radius: 0; }
  .modes .mode.on { background: var(--accent); color: #fff; }
  .jkey { font-family: var(--mono); font-size: 12px; font-weight: 600; }
  .jstat { font-size: 10px; padding: 1px 6px; border-radius: 8px;
           border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .jstat.hot { color: var(--warn); border-color: var(--warn); }
  .jstat.done { color: var(--ok); border-color: var(--ok); }
  .oplink { display: flex; align-items: center; gap: 8px; padding: 6px 8px;
            border: 1px solid var(--line); border-radius: 6px; margin-bottom: 5px;
            cursor: pointer; background: var(--bg); }
  .oplink:hover { border-color: var(--accent); }
  tr.jrow { cursor: pointer; }
  tr.jrow:hover td { background: var(--hover); }
  td.jk { color: var(--accent); font-weight: 600; }
  td.ext a { color: var(--dim); text-decoration: none; font-size: 13px; }
  td.ext a:hover { color: var(--accent); }
  .eprow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .eprow button { padding: 5px 12px; font-size: 12px; }
  label.mini { font-size: 11px; color: var(--dim); margin: 0; white-space: nowrap; }
  label.mini input { width: auto; }
  .jres:not(:empty) { margin: 0 0 12px; }
  .runbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
            background: var(--bg); }
  .cmpblk { margin-top: 10px; font-size: 13px; }
  .fields { margin-top: 5px; line-height: 2; }
  code.miss { color: var(--err); border: 1px solid var(--err); border-radius: 3px;
              padding: 1px 5px; font-size: 11px; }
  .desc { font-size: 13px; color: var(--body); max-height: 260px; overflow-y: auto;
          white-space: pre-wrap; line-height: 1.6; }
  details summary { cursor: pointer; }
  .aibox { border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px;
           margin-top: 8px; background: var(--panel); }
  .aihead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
            margin-bottom: 6px; }
  .aiozet { margin: 0 0 8px; font-size: 13px; }
  .kdur { display: inline-block; width: 18px; height: 18px; line-height: 18px;
          text-align: center; border-radius: 50%; font-size: 11px; font-weight: 700;
          border: 1px solid currentColor; }
  .kdur.saglaniyor { color: var(--ok); }
  .kdur.saglanmiyor { color: var(--err); }
  .kdur.dogrulanamadi { color: var(--warn); }
  .rcount { font-family: var(--mono); font-size: 11px; color: var(--accent);
            border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; min-width: 24px;
            text-align: center; }
  td.rtag { white-space: nowrap; width: 1%; font-family: var(--mono); font-size: 11px;
            color: var(--dim); }
  .sev.check, .sev.kolon, .sev.diff, .sev.test, .sev.guard,
  .sev.success, .sev.error, .sev.degisken { color: var(--dim); }
  .kpis { display: flex; gap: 8px; margin-bottom: 14px; }
  .kpi { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
         background: var(--panel); }
  .kpi .v { font-size: 20px; font-weight: 650; }
  .kpi .l { font-size: 10px; color: var(--dim); text-transform: uppercase;
            letter-spacing: .04em; margin-top: 2px; }
  .inline { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1 id="title">QA Endpoint Panosu</h1>
  <span class="meta" id="target">—</span>
  <span class="pill" id="authPill">auth ?</span>
  <span class="spacer"></span>
  <div class="modes">
    <button class="mode on" data-mode="ep">Uçlar</button>
    <button class="mode" data-mode="jira">Jira kartları</button>
    <button class="mode" data-mode="rules">Kurallar</button>
  </div>
  <button class="ghost" id="themeBtn" title="Açık / koyu tema">◐</button>
  <button class="ghost" id="authBtn">Giriş</button>
</header>

<main>
  <div id="list">
    <div id="filters">
      <input id="q" placeholder="ara: path, özet, servis…">
      <div class="inline" id="jiraFilters" style="display:none">
        <select id="jstatus"><option value="">tüm statüler</option></select>
        <select id="jtype" style="width:130px"><option value="">tüm tipler</option></select>
      </div>
      <div class="inline" id="jiraFilters2" style="display:none">
        <select id="jmatch">
          <option value="">tümü</option>
          <option value="1">endpoint'i eşleşenler</option>
          <option value="0">eşleşmeyenler</option>
          <option value="none">endpoint geçmeyenler</option>
        </select>
      </div>
      <div class="inline" id="epFilters">
        <select id="svc"><option value="">tüm servisler</option></select>
        <select id="mth" style="width:130px">
          <option value="">tüm metotlar</option>
          <option value="GET">sadece GET</option>
          <option value="mut">sadece mutating</option>
          <option value="flag">sapma işaretli</option>
          <option value="jiratest">Jira: Test'te</option>
          <option value="nojira">Jira kartı yok</option>
        </select>
      </div>
      <div class="meta" id="count">—</div>
    </div>
    <div id="rows"></div>
  </div>
  <div id="detail"><div class="empty">Soldan bir endpoint seç.</div></div>
</main>

<script>
let CARDS = [], SEL = null, META = {};
let MODE = "ep", JIRA = [], JSEL = null, RULES = null, RSEL = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const j = o => JSON.stringify(o, null, 2);

async function api(path, body) {
  const opt = body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}

async function boot() {
  META = await api("/api/meta");
  $("#title").textContent = META.title + " — QA Panosu";
  $("#target").textContent = (META.baseUrl || "BASE_URL yok") + "  ·  tenant: " + META.tenantId
    + "  ·  " + META.operations + " operasyon";
  setAuth(META.authed, META.authSource);

  CARDS = await api("/api/cards");
  const svcs = [...new Set(CARDS.map(c => c.service))].sort();
  $("#svc").innerHTML = '<option value="">tüm servisler</option>'
    + svcs.map(s => `<option>${esc(s)}</option>`).join("");

  const jr = await api("/api/jira");
  JIRA = jr.cards || [];
  if (JIRA.length) {
    const st = [...new Set(JIRA.map(c => c.status))].sort();
    const ty = [...new Set(JIRA.map(c => c.type))].sort();
    $("#jstatus").innerHTML = '<option value="">tüm statüler</option>'
      + st.map(s => `<option>${esc(s)}</option>`).join("");
    $("#jtype").innerHTML = '<option value="">tüm tipler</option>'
      + ty.map(s => `<option>${esc(s)}</option>`).join("");
  }
  const hash = location.hash.slice(1);
  if (["jira", "rules", "ep"].includes(hash)) { setMode(hash); return; }
  render();
}

function setMode(mode) {
  MODE = mode;
  if (location.hash.slice(1) !== mode) history.replaceState(null, "", "#" + mode);
  document.querySelectorAll(".mode").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === mode));
  $("#epFilters").style.display   = mode === "ep" ? "" : "none";
  $("#jiraFilters").style.display  = mode === "jira" ? "" : "none";
  $("#jiraFilters2").style.display = mode === "jira" ? "" : "none";
  $("#q").style.display = mode === "rules" ? "none" : "";
  $("#q").placeholder = mode === "ep" ? "ara: path, özet, servis…"
                                      : "ara: TP-123, özet, atanan…";
  const empty = $("#detail").querySelector(".empty");
  if (empty) empty.textContent = mode === "ep" ? "Soldan bir endpoint seç."
                                               : "Soldan bir Jira kartı seç.";
  render();
}

function statClass(s) {
  if (["Test", "Test Blocked"].includes(s)) return "hot";
  if (["Ready For Release", "Tamam", "Ready For Deploy"].includes(s)) return "done";
  return "";
}

function filteredJira() {
  const q = $("#q").value.toLowerCase().trim();
  const st = $("#jstatus").value, ty = $("#jtype").value, mt = $("#jmatch").value;
  return JIRA.filter(c => {
    if (st && c.status !== st) return false;
    if (ty && c.type !== ty) return false;
    if (mt === "1" && !c.matched) return false;
    if (mt === "0" && !(c.endpointCount && !c.matched)) return false;
    if (mt === "none" && c.endpointCount) return false;
    if (q && !(c.key + " " + c.summary + " " + c.assignee).toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderJira() {
  const rows = filteredJira();
  $("#count").textContent = rows.length + " / " + JIRA.length + " kart";
  $("#rows").innerHTML = rows.slice(0, 400).map(c => `
    <div class="row ${JSEL === c.key ? "sel" : ""}" data-j="${esc(c.key)}">
      <div class="top">
        <span class="jkey">${esc(c.key)}</span>
        <span class="jstat ${statClass(c.status)}">${esc(c.status)}</span>
        ${c.operationCount ? `<span class="jbadge" title="bağlı uç">${c.operationCount} uç</span>`
          : c.endpointCount ? `<span class="jbadge test" title="endpoint geçiyor ama eşleşmedi">?</span>` : ""}
      </div>
      <div class="s">${esc(c.summary)}</div>
    </div>`).join("")
    + (rows.length > 400 ? `<div class="row s">… +${rows.length - 400} kart (aramayı daralt)</div>` : "");
  document.querySelectorAll("[data-j]").forEach(el =>
    el.onclick = () => openJira(el.dataset.j));
}

async function renderRules() {
  if (!RULES) RULES = await api("/api/rules");
  if (RULES.error) { $("#rows").innerHTML = `<div class="row s">${esc(RULES.error)}</div>`; return; }
  const o = RULES.ozet;
  $("#count").textContent = `${o.toplam} kural · ${o.testFonksiyonu} test fonksiyonu`;
  $("#rows").innerHTML = RULES.setler.map((s, i) => `
    <div class="row ${RSEL === i ? "sel" : ""}" data-r="${i}">
      <div class="top">
        <span class="rcount">${s.adet}</span>
        <span style="flex:1">${esc(s.ad)}</span>
        ${s.ag ? '<span class="jbadge" title="canlı ortam gerekir">ağ</span>' : ""}
      </div>
      <div class="s">${esc(s.kaynak)}</div>
    </div>`).join("");
  document.querySelectorAll("[data-r]").forEach(el =>
    el.onclick = () => { RSEL = Number(el.dataset.r); renderRules(); openRuleSet(); });
  openRuleSet();
}

function openRuleSet() {
  const s = RULES.setler[RSEL];
  const o = RULES.ozet;
  const b = RULES.baseline;
  $("#detail").innerHTML = `
    <h2>${esc(s.ad)}</h2>
    <div class="sub">${esc(s.kaynak)} · ${s.adet} kural ·
      ${s.ag ? "canlı ortam gerekir" : "ağsız çalışır"}</div>

    <div class="kpis">
      <div class="kpi"><div class="v">${o.otomatikKural}</div><div class="l">otomatik kural</div></div>
      <div class="kpi"><div class="v">${o.ajanKurali}</div><div class="l">ajan kuralı</div></div>
      <div class="kpi"><div class="v">${o.testFonksiyonu}</div><div class="l">test fonksiyonu</div></div>
      <div class="kpi"><div class="v">${b.toplam}</div><div class="l">baseline istisnası</div></div>
    </div>

    <section>
      <h3>Ne yapar</h3>
      <p style="margin:0;font-size:13px">${esc(s.aciklama)}</p>
    </section>

    <section>
      <h3>Kurallar (${s.kurallar.length})</h3>
      <table class="jt">${s.kurallar.map(r => `
        <tr><td class="rtag"><span class="sev ${esc(r.etiket)}">${esc(r.etiket)}</span></td>
            <td>${esc(r.metin)}</td></tr>`).join("")}</table>
    </section>

    <section>
      <h3>Baseline — bilinen sapmalar</h3>
      <p class="meta" style="margin:0 0 8px">Listedeki sapma testi kırmaz; listede
        <b>olmayan yeni</b> bir sapma kırar. Düzelen sapma listede kalırsa da kırar.</p>
      <table class="jt">${Object.entries(b.kategoriler).map(([k, n]) =>
        `<tr><td class="rtag">${n}</td><td>${esc(k)}</td></tr>`).join("")}</table>
    </section>

    <section>
      <h3>Kuralları uygulayan testler</h3>
      <table class="jt">${RULES.testDosyalari.map(f => `
        <tr><td class="rtag">${f.fonksiyon}</td>
            <td><code>${esc(f.dosya)}</code></td>
            <td class="ty">${f.agGerekir ? "canlı" : "ağsız"}</td>
            <td class="ty">${esc((f.marker || []).join(", "))}</td></tr>`).join("")}</table>
    </section>

    <section>
      <h3>pytest marker'ları</h3>
      <table class="jt">${RULES.markerlar.map(m => `
        <tr><td class="rtag"><code>${esc(m.ad)}</code></td><td>${esc(m.aciklama)}</td></tr>`).join("")}</table>
    </section>`;
}

async function openJira(key) {
  JSEL = key; renderJira();
  const c = await api("/api/jira/" + encodeURIComponent(key));
  if (c.error) { $("#detail").innerHTML = `<div class="empty">${esc(c.error)}</div>`; return; }

  const eps = (c.endpoints || []).map((e, i) => {
    if (!e.operations.length) {
      return `<div class="warnbox" style="margin-bottom:6px">
        <code>${esc(e.method)} ${esc(e.shape)}</code> — sözleşmede karşılığı <b>yok</b>.
        Uç mevcut olmayabilir ya da kart eski bir yolu referans veriyor olabilir.</div>`;
    }
    return e.operations.map(o => `
      <div class="eprow">
        <div class="oplink" data-op="${esc(o.key)}" style="flex:1;margin:0">
          <span class="m ${o.method}">${o.method}</span>
          <span class="p" style="flex:1">${esc(o.path)}</span>
          <span class="s">${esc(o.service)}</span>
          <span class="meta">aç →</span>
        </div>
        ${o.mutating ? `<label class="inline mini"><input type="checkbox" class="jconfirm" data-i="${i}"> onay</label>` : ""}
        <button class="jrun" data-i="${i}" data-mut="${o.mutating ? 1 : 0}">Çalıştır</button>
      </div>
      <div class="jres" data-i="${i}"></div>`).join("");
  }).join("");

  $("#detail").innerHTML = `
    <h2>${esc(c.key)}</h2>
    <div class="sub">
      <span class="jstat ${statClass(c.status)}">${esc(c.status)}</span>
      &nbsp;${esc(c.type)}${c.assignee ? " · " + esc(c.assignee) : ""}
      ${c.parent ? ` · üst: <a href="${esc(META.jiraBase)}/browse/${esc(c.parent)}" target="_blank">${esc(c.parent)}</a>` : ""}
      &nbsp;·&nbsp;<a href="${esc(META.jiraBase)}/browse/${esc(c.key)}" target="_blank">Jira'da aç</a>
    </div>
    <section><h3>Özet</h3><p style="margin:0">${esc(c.summary)}</p></section>

    <section>
      <h3>Kartın endpoint'leri (${(c.endpoints || []).length})</h3>
      ${eps || '<p class="meta" style="margin:0">Kart metninde endpoint referansı yok.</p>'}
    </section>

    ${c.expectedResponse ? `<section>
      <h3>Kartın beklediği yanıt <span class="meta">(karşılaştırma referansı)</span></h3>
      <pre>${esc(j(c.expectedResponse))}</pre></section>` : ""}

    ${c.requestBody ? `<section>
      <h3>Kartın istek gövdesi</h3><pre>${esc(j(c.requestBody))}</pre></section>` : ""}

    ${(c.blocks || []).filter(b => b.kind === "parca" || b.kind === "endpoint").length ? `<section>
      <h3>Diğer kod blokları</h3>
      ${c.blocks.filter(b => b.kind === "parca" || b.kind === "endpoint")
        .map(b => `<pre>${esc(b.text)}</pre>`).join("")}</section>` : ""}

    ${c.description ? `<section>
      <h3>Açıklama / kabul kriterleri</h3>
      <div class="desc">${esc(c.description)}</div></section>` : ""}

    ${(c.tables || []).length ? `<section>
      <h3>Kart tabloları (${c.tables.length})</h3>
      ${c.tables.map(tb => `<pre>${esc(tb)}</pre>`).join("")}</section>` : ""}`;

  document.querySelectorAll("[data-op]").forEach(el =>
    el.onclick = () => { setMode("ep"); openCard(el.dataset.op); });
  document.querySelectorAll(".jrun").forEach(el =>
    el.onclick = () => runFromCard(c, el));
}

// Kartin endpoint'ini kosar ve KARTIN beklentisiyle karsilastirir.
async function runFromCard(card, btn) {
  const i = btn.dataset.i;
  const box = document.querySelector(`.jres[data-i="${i}"]`);
  const confirmBox = document.querySelector(`.jconfirm[data-i="${i}"]`);

  if (btn.dataset.mut === "1" && !(confirmBox && confirmBox.checked)) {
    box.innerHTML = `<div class="verdict bad">Bu operasyon canlı veri değiştirir —
      çalıştırmak için "onay" kutusunu işaretle.</div>`;
    return;
  }

  btn.disabled = true; btn.textContent = "Çalışıyor…";
  box.innerHTML = `<div class="meta">istek gönderiliyor…</div>`;
  const r = await api("/api/jira-run/" + encodeURIComponent(card.key),
                      { endpointIndex: Number(i), confirm: !!(confirmBox && confirmBox.checked) });
  btn.disabled = false; btn.textContent = "Çalıştır";

  if (r.error) { box.innerHTML = `<div class="verdict bad">${esc(r.error)}</div>`; return; }

  const cmp = r.comparison || {};
  const cls = cmp.durum === "uyumlu" ? "ok" : cmp.durum === "uyumsuz" ? "bad" : "warn";

  box.innerHTML = `
    <div class="runbox">
      <div class="meta">${esc(r.operation.method)} ${esc(r.operation.path)}
        · HTTP <b>${r.status}</b> ${r.documented ? "(dokümante)" : "(DOKÜMANTE DEĞİL)"}
        · ${r.elapsedMs} ms</div>

      <div class="verdict ${cls}" style="margin-top:8px">${esc(cmp.verdict || "—")}</div>

      ${cmp.eksik?.length ? `<div class="cmpblk"><b>Kartta var, canlıda YOK (${cmp.eksik.length})</b>
        <div class="fields">${cmp.eksik.map(f => `<code class="miss">${esc(f)}</code>`).join(" ")}</div></div>` : ""}

      ${cmp.tipFarki?.length ? `<div class="cmpblk"><b>Tip farkı (${cmp.tipFarki.length})</b>
        <table class="jt">${cmp.tipFarki.map(m => `<tr>
          <td><code>${esc(m.alan)}</code></td>
          <td class="ty">kart: <b>${esc(m.beklenen)}</b></td>
          <td class="ty">canlı: <b>${esc(m.gelen)}</b></td></tr>`).join("")}</table></div>` : ""}

      ${cmp.notlar?.length ? cmp.notlar.map(n =>
        `<div class="warnbox" style="margin:8px 0 0">${esc(n)}</div>`).join("") : ""}

      ${r.findings?.length ? `<div class="cmpblk"><b>Otomatik yorum</b>
        <span class="meta">${esc(r.findingsSummary || "")}</span>
        ${r.findings.map(f => `<div class="finding ${esc(f.severity)}">
          <b><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span>${esc(f.baslik)}</b>
          <p>${esc(f.aciklama)}</p>
          ${f.oneri ? `<div class="oneri">→ ${esc(f.oneri)}</div>` : ""}</div>`).join("")}</div>` : ""}

      <details style="margin-top:8px"><summary class="meta">canlı yanıt (PII maskeli)</summary>
        <pre>${esc(j(r.body))}</pre></details>

      <div class="inline" style="margin-top:10px">
        <button class="ghost aibtn" data-i="${i}">Claude ile değerlendir</button>
        <span class="meta">kartın düz metin kabul kriterlerini yanıta karşı okur</span>
      </div>
      <div class="airesult" data-i="${i}"></div>
    </div>`;

  const aibtn = box.querySelector(".aibtn");
  if (aibtn) aibtn.onclick = () => aiReview(card, i, r, aibtn);
}

// LLM katmani: yapisal motorlarin goremedigi prose kabul kriterleri.
// Cikti KANIT DEGIL YORUM — verdict'i kurallar belirler.
async function aiReview(card, i, runResult, btn) {
  const out = document.querySelector(`.airesult[data-i="${i}"]`);
  btn.disabled = true; btn.textContent = "Değerlendiriliyor…";
  out.innerHTML = `<div class="meta" style="margin-top:8px">Claude okuyor…</div>`;

  const r = await api("/api/ai-review/" + encodeURIComponent(card.key), { run: runResult });
  btn.disabled = false; btn.textContent = "Claude ile değerlendir";

  if (r.error) {
    out.innerHTML = `<div class="warnbox" style="margin-top:8px">${esc(r.error)}</div>`;
    return;
  }

  const icon = { saglaniyor: "✓", saglanmiyor: "✕", dogrulanamadi: "?" };
  out.innerHTML = `
    <div class="aibox">
      <div class="aihead">
        <b>Claude değerlendirmesi</b>
        <span class="meta">yorum — kanıt değil · ${esc(r._meta?.model || "")}
          · ${r._meta?.girdiToken ?? "?"}→${r._meta?.ciktiToken ?? "?"} token</span>
      </div>
      <p class="aiozet">${esc(r.ozet)}</p>
      ${r.kriterler?.length ? `<table class="jt">${r.kriterler.map(k => `
        <tr>
          <td class="rtag"><span class="kdur ${esc(k.durum)}">${icon[k.durum] || "?"}</span></td>
          <td><b>${esc(k.kriter)}</b><div class="meta">${esc(k.gerekce)}</div></td>
        </tr>`).join("")}</table>`
        : `<p class="meta">Kartta değerlendirilebilir kabul kriteri bulunamadı.</p>`}
      ${r.ekBulgular?.length ? `<div class="cmpblk"><b>Ek gözlemler</b>
        <ul style="margin:4px 0 0;padding-left:18px;font-size:12px">
        ${r.ekBulgular.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>` : ""}
    </div>`;
}

function setAuth(on, src) {
  const p = $("#authPill");
  p.className = "pill " + (on ? "on" : "off");
  p.textContent = on ? "auth: token yüklü" + (src ? " (" + src + ")" : "") : "auth: yok";
}

function filtered() {
  const q = $("#q").value.toLowerCase().trim();
  const svc = $("#svc").value, mth = $("#mth").value;
  return CARDS.filter(c => {
    if (svc && c.service !== svc) return false;
    if (mth === "GET" && c.method !== "GET") return false;
    if (mth === "mut" && !c.mutating) return false;
    if (mth === "flag" && !c.flagged) return false;
    if (mth === "jiratest" && !c.jiraInTest) return false;
    if (mth === "nojira" && c.jiraCount) return false;
    if (q && !(c.path + " " + c.summary + " " + c.service).toLowerCase().includes(q)) return false;
    return true;
  });
}

function render() {
  if (MODE === "rules") return renderRules();
  if (MODE === "jira") return renderJira();
  const rows = filtered();
  $("#count").textContent = rows.length + " / " + CARDS.length + " operasyon";
  $("#rows").innerHTML = rows.map(c => `
    <div class="row ${SEL === c.key ? "sel" : ""}" data-k="${esc(c.key)}">
      <div class="top">
        <span class="m ${c.method}">${c.method}</span>
        <span class="p">${esc(c.path)}</span>
        ${c.flagged ? '<span class="flag" title="bilinen envelope sapması">▲</span>' : ""}
        ${c.jiraInTest ? `<span class="jbadge test" title="Test statüsünde ${c.jiraInTest} kart">${c.jiraInTest} TEST</span>`
          : c.jiraCount ? `<span class="jbadge" title="${c.jiraCount} bağlı kart">${c.jiraCount}</span>` : ""}
      </div>
      <div class="s">${esc(c.service)} · ${esc(c.summary)}</div>
    </div>`).join("");
  document.querySelectorAll(".row").forEach(el =>
    el.onclick = () => openCard(el.dataset.k));
}

async function openCard(key) {
  SEL = key; render();
  const c = await api("/api/card/" + encodeURIComponent(key));

  const pathInputs = (c.pathParams || []).map(p =>
    `<div><label>${esc(p)}</label><input class="pp" data-n="${esc(p)}" placeholder="${esc(p)} değeri"></div>`).join("");
  const queryInputs = (c.queryParams || []).map(q =>
    `<div><label>${esc(q.name)}</label><input class="qp" data-n="${esc(q.name)}" value="${esc(q.example ?? "")}"></div>`).join("");

  $("#detail").innerHTML = `
    <h2><span class="m ${c.method}">${c.method}</span> ${esc(c.path)}</h2>
    <div class="sub">${esc(c.service)} · ${esc(c.summary)}</div>

    ${c.envelopeExceptions?.length ? `<div class="warnbox"><b>Bilinen sapma (${c.envelopeExceptions.length})</b><br>`
      + c.envelopeExceptions.map(e => `<code>${esc(e.anahtar)}</code> — <b>${esc(e.kategori)}</b>: ${esc(e.gerekce)}`).join("<br>")
      + `</div>` : ""}

    ${c.jira?.length ? `<section>
      <h3>Bağlı Jira kartları (${c.jira.length})</h3>
      <table class="jt">${c.jira.map(j => `
        <tr class="jrow" data-jk="${esc(j.key)}" title="panelde kartı aç">
          <td class="jk">${esc(j.key)}</td>
          <td><span class="st ${["Test","Test Blocked"].includes(j.status) ? "hot" : ""}">${esc(j.status)}</span></td>
          <td class="ty">${esc(j.type)}</td>
          <td>${esc(j.summary)}</td>
          <td class="ext"><a href="${esc(META.jiraBase)}/browse/${esc(j.key)}" target="_blank"
             onclick="event.stopPropagation()" title="Jira'da aç">↗</a></td>
        </tr>`).join("")}</table>
    </section>` : ""}

    <section>
      <h3>Sözleşme</h3>
      <dl class="kv">
        <dt>Dokümante status</dt><dd>${(c.documentedStatuses||[]).join(", ") || "—"}</dd>
        <dt>Beklenen</dt><dd>${c.expectedStatus ?? "—"}</dd>
        <dt>Yanıt şeması</dt><dd>${c.hasResponseSchema ? "var" : "YOK"}</dd>
        <dt>Auth</dt><dd>${c.auth ? "gerekli" : "public"}</dd>
        <dt>Tip</dt><dd>${c.mutating ? "MUTATING — veri değiştirir" : "salt-okunur"}</dd>
      </dl>
    </section>

    <section>
      <h3>Canlı test</h3>
      ${c.mutating ? `<div class="warnbox">Bu operasyon canlı veri <b>yaratır/değiştirir</b>. Çalıştırmak için onay kutusunu işaretle.</div>` : ""}
      <div class="grid">
        ${pathInputs}${queryInputs}
        ${c.requestExample !== null && c.requestExample !== undefined
          ? `<div><label>Gövde (dokümante örnek)</label><textarea id="body">${esc(j(c.requestExample))}</textarea></div>` : ""}
        <div class="inline">
          ${c.pathParams?.length ? `<button class="ghost" id="resolve">Gerçek ID getir</button>` : ""}
          ${c.mutating ? `<label class="inline" style="margin:0"><input type="checkbox" id="confirm" style="width:auto"> onaylıyorum</label>` : ""}
          <button id="run">Çalıştır</button>
        </div>
        <div id="resolveInfo" class="meta"></div>
      </div>
      <div id="result" style="margin-top:12px"></div>
    </section>

    ${c.responseExample !== null && c.responseExample !== undefined ? `<section>
      <h3>Dokümante örnek yanıt</h3><pre>${esc(j(c.responseExample))}</pre></section>` : ""}
  `;

  $("#run").onclick = () => runCard(c);
  if ($("#resolve")) $("#resolve").onclick = () => resolveIds(c);
  document.querySelectorAll(".jrow").forEach(el =>
    el.onclick = () => { setMode("jira"); openJira(el.dataset.jk); });
}

// Koleksiyonda gerçek ID yok ({{last_*_id}} koşum anında doluyordu) —
// path parametrelerini canlı koleksiyonlardan çekip alanlara yazar.
async function resolveIds(c) {
  const btn = $("#resolve"), info = $("#resolveInfo");
  btn.disabled = true; btn.textContent = "Aranıyor…";
  const r = await api("/api/resolve/" + encodeURIComponent(c.key));
  btn.disabled = false; btn.textContent = "Gerçek ID getir";

  const values = r.values || {};
  document.querySelectorAll(".pp").forEach(i => {
    if (values[i.dataset.n]) i.value = values[i.dataset.n];
  });

  const found = Object.keys(values);
  const lines = found.map(k => `${k} ← ${r.resolvedFrom?.[k] || "?"}`);
  info.innerHTML = (r.error ? `<span style="color:var(--warn)">${esc(r.error)}</span><br>` : "")
    + (lines.length ? esc(lines.join(" · ")) : "");
}

async function runCard(c) {
  const btn = $("#run"); btn.disabled = true; btn.textContent = "Çalışıyor…";
  const pathParams = {}, query = {};
  document.querySelectorAll(".pp").forEach(i => { if (i.value) pathParams[i.dataset.n] = i.value; });
  document.querySelectorAll(".qp").forEach(i => { if (i.value) query[i.dataset.n] = i.value; });

  const r = await api("/api/run/" + encodeURIComponent(c.key), {
    pathParams, query,
    body: $("#body")?.value,
    confirm: $("#confirm")?.checked || false,
  });

  btn.disabled = false; btn.textContent = "Çalıştır";

  if (r.error) {
    $("#result").innerHTML = `<div class="verdict bad">${esc(r.error)}</div>`;
    return;
  }
  const cls = r.verdict.startsWith("UYUMLU") ? "ok"
            : r.verdict.startsWith("SEMA") ? "warn" : "bad";
  $("#result").innerHTML = `
    <div class="verdict ${cls}">${esc(r.verdict)}</div>
    <dl class="kv">
      <dt>HTTP</dt><dd>${r.status} ${r.documented ? "(dokümante)" : "(DOKÜMANTE DEĞİL)"}</dd>
      <dt>Süre</dt><dd>${r.elapsedMs} ms</dd>
      <dt>Content-Type</dt><dd>${esc(r.contentType)}</dd>
    </dl>
    ${r.findings?.length ? `<div style="margin:12px 0">
      <b>Otomatik yorum</b> <span class="meta">${esc(r.findingsSummary || "")}</span>
      <div style="margin-top:6px">` + r.findings.map(f => `
        <div class="finding ${esc(f.severity)}">
          <b><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span>${esc(f.baslik)}</b>
          <p>${esc(f.aciklama)}</p>
          ${f.oneri ? `<div class="oneri">→ ${esc(f.oneri)}</div>` : ""}
        </div>`).join("") + `</div></div>`
      : `<div class="meta" style="margin:10px 0">${esc(r.findingsSummary || "")}</div>`}

    ${r.schemaErrors?.length ? `<div style="margin:8px 0"><b>Ham şema sapmaları</b><pre>`
      + esc(r.schemaErrors.map(e => e.path + ": " + e.message).join("\n")) + `</pre></div>` : ""}
    <div style="margin-top:8px"><b>Yanıt</b> <span class="meta">(PII maskeli)</span>
      <pre>${esc(j(r.body))}</pre></div>`;
}

$("#authBtn").onclick = async () => {
  const email = prompt("E-posta:");
  if (!email) return;
  const req = await api("/api/auth/otp/request", { email });
  if (req.error) return alert("OTP isteği başarısız: " + req.error);
  const otp = prompt("OTP kodu (HTTP " + req.status + "):");
  if (!otp) return;
  const v = await api("/api/auth/otp/verify", { email, otp });
  if (v.authed) { setAuth(true, "otp"); alert("Giriş başarılı."); }
  else alert("Giriş başarısız: " + j(v.body || v.error));
};

// Tema — tercih localStorage'da saklanir, varsayilan acik
function applyTheme(mode) {
  document.documentElement.setAttribute("data-theme", mode);
  localStorage.setItem("qa-theme", mode);
  $("#themeBtn").textContent = mode === "dark" ? "☀" : "☾";
}
applyTheme(localStorage.getItem("qa-theme") || "light");
$("#themeBtn").onclick = () =>
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

["#q", "#svc", "#mth", "#jstatus", "#jtype", "#jmatch"].forEach(s =>
  $(s).addEventListener("input", render));
document.querySelectorAll(".mode").forEach(b =>
  b.onclick = () => setMode(b.dataset.mode));
boot();
</script>
